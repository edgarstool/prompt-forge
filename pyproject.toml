[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-forge"
version = "0.2.0.dev0"
description = "PromptOS compiler/router pipeline: classify, resolve, route, compose, and evaluate bounded task contracts."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Edgar (王世鈞)" }]
dependencies = ["mcp>=1.26.0,<2"]

[project.scripts]
prompt-forge = "prompt_forge.cli:main"
prompt-forge-service = "prompt_forge.service:main"
edgar-os-prompt-forge = "prompt_forge.edgar_os:main"
prompt-forge-mcp = "prompt_forge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
